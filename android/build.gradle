allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))
}
// flutter_compass_v2 1.0.3 pins compileSdk 33, but its AndroidX dependencies
// require 34+, so AGP fails the AAR metadata check. Lift every plugin module to
// the app's compileSdk.
subprojects {
    afterEvaluate { sub ->
        if (sub.plugins.hasPlugin("com.android.library")) {
            sub.android {
                compileSdk = 36
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:-options"
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
